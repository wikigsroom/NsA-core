<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>NsA · 内容工作台</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<aside><p class="brand">N<span>s</span>A <small>OPERATIONS</small></p><p class="muted">内容工作台</p><nav id="navigation"></nav><button id="logout">退出登录</button></aside>
<main><header><div><p class="eyebrow">PRIVATE CONTENT OPERATIONS</p><h1 id="title">发布与审核</h1><p class="muted">构建、验证、独立审核，再发布到对应目录。</p></div><button id="reload">刷新</button></header>
<section id="login"><h2>登录工作台</h2><p>正式环境使用组织 OIDC 登录。本地开发凭据仅用于本机验证。</p><button id="oidc">组织账号登录</button><details><summary>本地开发登录</summary><label>访问凭据<input id="token" type="password" autocomplete="off"></label><button id="connect">连接</button></details><p id="login-status" role="status"></p></section>
<section id="workspace" hidden><div class="toolbar"><p id="summary"></p><button id="new">新建记录</button></div><div id="items" class="items"></div><div class="pager"><button id="more">下一页</button></div></section>
<section id="editor" hidden><h2 id="editor-title">记录操作</h2><p id="editor-hint"></p><label>请求内容<textarea id="payload" spellcheck="false" rows="18"></textarea></label><div class="toolbar"><button id="submit">提交</button><button id="cancel">取消</button></div></section><pre id="status" role="status"></pre></main></body></html>
